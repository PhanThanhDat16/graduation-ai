[tool.poetry]
package-mode = false

[project]
name = "ai"
version = "0.1.0"
description = ""
authors = [
    {name = "PhanThanhDat16",email = "phandat1662004@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "langchain (>=1.2.13,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "fastapi (>=0.135.2,<0.136.0)",
    "langchain-openai (>=1.1.12,<2.0.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
    "langchain-core (>=1.2.22,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "onnxruntime (>=1.24.4,<2.0.0)",
    "pymongo (>=4.16.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.8,<0.16.0)",
    "mypy (>=1.19.1,<2.0.0)"
]
chainlit = [
    "chainlit (>=2.10.1,<3.0.0)"
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"